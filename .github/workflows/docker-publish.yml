name: Build and Push Docker Image

on:
  push:
    tags: ['v*']
    # Tag pushes ignore path filters. Default-branch runs seed caches that later
    # tag refs may restore without rebuilding unchanged dependencies.
    branches: [master]
    paths:
      - '.bazelrc'
      - '.bazelversion'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
      - 'BUILD'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'WORKSPACE'
      - 'WORKSPACE.bazel'
      - 'requirements.txt'
      - 'go.mod'
      - 'go.sum'
      - '**/BUILD'
      - '**/BUILD.bazel'
      - '**/*.bzl'
      - 'build/bazel/**'
      - 'build/docker/**'
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: docker
        type: choice
        options:
          - docker
          - macos-arm64
          - all

env:
  IMAGE_NAME: jaysen2apache/spanner-emulator-extended
  REGISTRY: docker.io

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'macos-arm64'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            runner_arch: x86_64
            bazel_jobs: 2
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: aarch64
            bazel_jobs: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      DOCKERHUB_AUTHENTICATED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "${{ matrix.runner_arch }}" ]]; then
            echo "Expected native ${{ matrix.runner_arch }} runner, got $actual_arch" >&2
            exit 1
          fi
          echo "Building ${{ matrix.platform }} natively on $actual_arch"

      - name: Require Docker Hub credentials for release tags
        if: startsWith(github.ref, 'refs/tags/v') && env.DOCKERHUB_AUTHENTICATED != 'true'
        shell: bash
        run: |
          echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets before publishing a release tag."
          exit 1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_AUTHENTICATED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Generate reproducible build files manifest
        run: python3 build/docker/generate_build_manifest.py

      - name: Hash Bazel graph inputs
        id: dependency-hash
        shell: bash
        run: |
          sha256sum build_files.tar \
            | cut -d ' ' -f 1 \
            | sed 's/^/value=/' >> "$GITHUB_OUTPUT"

      # Bazel does not hash host tools such as /usr/bin/gcc into action keys.
      # Resolve the real toolchain image first so disk-cache entries never
      # cross compiler, package, or base-image changes.
      - name: Resolve toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: toolchain
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          tags: spanner-emulator-toolchain:${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}

      - name: Fingerprint resolved toolchain
        id: toolchain-fingerprint
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect \
            --format '{{.Id}}' \
            "spanner-emulator-toolchain:${{ matrix.arch }}")"
          echo "value=${image_id#sha256:}" >> "$GITHUB_OUTPUT"
          docker image rm "spanner-emulator-toolchain:${{ matrix.arch }}" >/dev/null

      - name: Restore Bazel repository cache archive
        id: bazel-repo-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bazel-cache-archives-${{ matrix.arch }}/repo.tar.gz
          key: bazel-repo-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.dependency-hash.outputs.value }}
          restore-keys: bazel-repo-v2-${{ runner.os }}-${{ matrix.arch }}-

      - name: Restore Bazel disk cache archive
        id: bazel-disk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bazel-cache-archives-${{ matrix.arch }}/disk.tar.gz
          key: bazel-disk-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.toolchain-fingerprint.outputs.value }}-${{ github.sha }}
          restore-keys: bazel-disk-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.toolchain-fingerprint.outputs.value }}-

      - name: Expand caches within runner budget
        id: cache-budget
        shell: bash
        env:
          CACHE_ARCHIVE_DIR: ${{ runner.temp }}/bazel-cache-archives-${{ matrix.arch }}
          REPO_CACHE_PATH: ${{ runner.temp }}/bazel-repo-cache-${{ matrix.arch }}
          DISK_CACHE_PATH: ${{ runner.temp }}/bazel-disk-cache-${{ matrix.arch }}
          MAX_ARCHIVE_BYTES: 3221225472
          MAX_MOUNT_KIB: 2097152
          MAX_COMBINED_KIB: 4194304
        run: |
          set -euo pipefail
          rm -rf "$REPO_CACHE_PATH" "$DISK_CACHE_PATH"
          mkdir -p "$REPO_CACHE_PATH" "$DISK_CACHE_PATH"
          trimmed=false

          repo_archive="$CACHE_ARCHIVE_DIR/repo.tar.gz"
          disk_archive="$CACHE_ARCHIVE_DIR/disk.tar.gz"
          if [[ -f "$repo_archive" ]]; then
            if (( $(stat -c %s "$repo_archive") <= MAX_ARCHIVE_BYTES )); then
              tar --no-same-owner -xzf "$repo_archive" -C "$REPO_CACHE_PATH"
            else
              echo "Repository cache archive exceeds 3 GiB; discarding it."
              trimmed=true
            fi
          fi
          if [[ -f "$disk_archive" ]]; then
            if (( $(stat -c %s "$disk_archive") <= MAX_ARCHIVE_BYTES )); then
              tar --no-same-owner -xzf "$disk_archive" -C "$DISK_CACHE_PATH"
            else
              echo "Disk cache archive exceeds 3 GiB; discarding it."
              trimmed=true
            fi
          fi
          rm -rf "$CACHE_ARCHIVE_DIR"

          repo_kib="$(du -sk "$REPO_CACHE_PATH" | cut -f 1)"
          disk_kib="$(du -sk "$DISK_CACHE_PATH" | cut -f 1)"
          if (( repo_kib > MAX_MOUNT_KIB )); then
            echo "Repository cache exceeds 2 GiB expanded; discarding it."
            rm -rf "$REPO_CACHE_PATH"
            mkdir -p "$REPO_CACHE_PATH"
            repo_kib=0
            trimmed=true
          fi
          if (( disk_kib > MAX_MOUNT_KIB || repo_kib + disk_kib > MAX_COMBINED_KIB )); then
            echo "Expanded caches exceed the runner budget; discarding the disk cache."
            rm -rf "$DISK_CACHE_PATH"
            mkdir -p "$DISK_CACHE_PATH"
            disk_kib=0
            trimmed=true
          fi

          echo "trimmed=$trimmed" >> "$GITHUB_OUTPUT"
          echo "Injecting $((repo_kib + disk_kib)) KiB of Bazel caches"

      - name: Inject Bazel cache mounts into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance-${{ matrix.arch }}
          cache-map: |
            {
              "${{ runner.temp }}/bazel-disk-cache-${{ matrix.arch }}": {
                "target": "/bazel-disk-cache",
                "id": "spanner-emulator-${{ matrix.arch }}-disk",
                "sharing": "locked"
              },
              "${{ runner.temp }}/bazel-repo-cache-${{ matrix.arch }}": {
                "target": "/bazel-repo-cache",
                "id": "spanner-emulator-${{ matrix.arch }}-repo",
                "sharing": "locked"
              }
            }
          skip-extraction: true

      - name: Build cache or push tag digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ env.DOCKERHUB_AUTHENTICATED == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.IMAGE_NAME, matrix.arch) || '' }}
          build-args: |
            BAZEL_JOBS=${{ matrix.bazel_jobs }}
            BAZEL_RAM=HOST_RAM*.8
            BAZEL_DISK_CACHE_MAX_BYTES=2147483648
            BAZEL_CACHE_WARM_NONCE=${{ (steps.bazel-repo-cache.outputs.cache-hit != 'true' || steps.bazel-disk-cache.outputs.cache-hit != 'true' || steps.cache-budget.outputs.trimmed == 'true') && format('{0}-{1}', github.run_id, github.run_attempt) || 'stable' }}
            BAZEL_CACHE_NAMESPACE=spanner-emulator-${{ matrix.arch }}
            BAZEL_REPO_CACHE_NAMESPACE=spanner-emulator-${{ matrix.arch }}

      - name: Export bounded Bazel cache archives
        if: steps.bazel-repo-cache.outputs.cache-hit != 'true' || steps.bazel-disk-cache.outputs.cache-hit != 'true' || steps.cache-budget.outputs.trimmed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          target: cache-archives
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/bazel-cache-archives-${{ matrix.arch }},platform-split=false
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          build-args: |
            BAZEL_CACHE_NAMESPACE=spanner-emulator-${{ matrix.arch }}
            BAZEL_REPO_CACHE_NAMESPACE=spanner-emulator-${{ matrix.arch }}
            CACHE_EXPORT_MAX_BYTES=2147483648
            CACHE_EXPORT_DISK=${{ steps.bazel-disk-cache.outputs.cache-hit != 'true' }}
            CACHE_EXPORT_REPO=${{ steps.bazel-repo-cache.outputs.cache-hit != 'true' }}
            CACHE_EXPORT_NONCE=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Enforce outgoing cache archive budget
        id: outgoing-cache
        if: steps.bazel-repo-cache.outputs.cache-hit != 'true' || steps.bazel-disk-cache.outputs.cache-hit != 'true' || steps.cache-budget.outputs.trimmed == 'true'
        shell: bash
        env:
          CACHE_ARCHIVE_DIR: ${{ runner.temp }}/bazel-cache-archives-${{ matrix.arch }}
          MAX_COMBINED_BYTES: 3221225472
        run: |
          set -euo pipefail
          repo_archive="$CACHE_ARCHIVE_DIR/repo.tar.gz"
          disk_archive="$CACHE_ARCHIVE_DIR/disk.tar.gz"
          repo_bytes=0
          disk_bytes=0
          save_repo=false
          save_disk=false

          if [[ -f "$repo_archive" ]]; then
            repo_bytes="$(stat -c %s "$repo_archive")"
            save_repo=true
          elif [[ -f "$CACHE_ARCHIVE_DIR/repo-too-large" ]]; then
            echo "Repository cache exceeds 2 GiB; it will not be saved."
          fi
          if [[ -f "$disk_archive" ]]; then
            disk_bytes="$(stat -c %s "$disk_archive")"
            save_disk=true
          elif [[ -f "$CACHE_ARCHIVE_DIR/disk-too-large" ]]; then
            echo "Disk cache exceeds 2 GiB; it will not be saved."
          fi

          if (( repo_bytes > MAX_COMBINED_BYTES )); then
            rm -f "$repo_archive"
            repo_bytes=0
            save_repo=false
          fi
          if (( repo_bytes + disk_bytes > MAX_COMBINED_BYTES )); then
            echo "Compressed caches exceed 3 GiB; omitting the disk cache."
            rm -f "$disk_archive"
            disk_bytes=0
            save_disk=false
          fi

          echo "save-repo=$save_repo" >> "$GITHUB_OUTPUT"
          echo "save-disk=$save_disk" >> "$GITHUB_OUTPUT"
          echo "Saving $((repo_bytes + disk_bytes)) bytes of Bazel cache archives"

      - name: Save Bazel repository cache archive
        if: steps.outgoing-cache.outputs.save-repo == 'true' && steps.bazel-repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bazel-cache-archives-${{ matrix.arch }}/repo.tar.gz
          key: bazel-repo-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.dependency-hash.outputs.value }}

      - name: Save Bazel disk cache archive
        if: steps.outgoing-cache.outputs.save-disk == 'true' && steps.bazel-disk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bazel-cache-archives-${{ matrix.arch }}/disk.tar.gz
          key: bazel-disk-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.toolchain-fingerprint.outputs.value }}-${{ github.sha }}

      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  macos-arm64:
    name: Build native macOS ARM64 artifacts
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target != 'docker') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "arm64" ]]; then
            echo "Expected native arm64 runner, got $actual_arch" >&2
            exit 1
          fi

      - name: Install macOS build prerequisites
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          BAZEL_VERSION: 7.6.1
          BAZEL_DARWIN_ARM64_SHA256: 45cca81a839d7495258b19ee8371c7b891f350586ef37b9940f7b531eb654cc8
        run: |
          set -euo pipefail
          brew install gnu-sed protobuf
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "PROTOC=$(brew --prefix protobuf)/bin/protoc" >> "$GITHUB_ENV"
          if [[ "$(cat .bazelversion)" != "$BAZEL_VERSION" ]]; then
            echo ".bazelversion must match the pinned macOS Bazel binary" >&2
            exit 1
          fi
          bazel_path="$RUNNER_TEMP/bazel-$BAZEL_VERSION-darwin-arm64"
          curl --fail --location \
            "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-darwin-arm64" \
            --output "$bazel_path"
          printf '%s  %s\n' "$BAZEL_DARWIN_ARM64_SHA256" "$bazel_path" \
            | shasum -a 256 --check -
          chmod 0755 "$bazel_path"
          echo "BAZEL=$bazel_path" >> "$GITHUB_ENV"

      - name: Generate reproducible build files manifest
        run: python3 build/docker/generate_build_manifest.py

      - name: Hash Bazel graph inputs
        id: macos-dependency-hash
        shell: bash
        run: |
          shasum -a 256 build_files.tar \
            | cut -d ' ' -f 1 \
            | sed 's/^/value=/' >> "$GITHUB_OUTPUT"

      - name: Restore Bazel repository cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bazel-repository-cache-macos-arm64
          key: bazel-repo-v2-${{ runner.os }}-arm64-${{ steps.macos-dependency-hash.outputs.value }}
          restore-keys: bazel-repo-v2-${{ runner.os }}-arm64-

      - name: Build native binaries
        shell: bash
        env:
          BAZEL_REPOSITORY_CACHE: ${{ runner.temp }}/bazel-repository-cache-macos-arm64
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -euo pipefail
          mkdir -p "$BAZEL_REPOSITORY_CACHE"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Building with macOS SDK $sdk_version"
          "$BAZEL" --host_jvm_args=-Xmx1536m build \
            -c opt \
            --strip=always \
            --macos_sdk_version="$sdk_version" \
            --macos_minimum_os=12.0 \
            --host_macos_minimum_os=12.0 \
            --spawn_strategy=standalone \
            --jobs=2 \
            '--local_resources=memory=HOST_RAM*.70' \
            --repository_cache="$BAZEL_REPOSITORY_CACHE" \
            //binaries:emulator_main \
            //binaries:gateway_main

      - name: Package native binaries
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/spanner-emulator-macos-arm64"
          mkdir -p "$package_dir"
          cp -L bazel-bin/binaries/emulator_main "$package_dir/"
          cp -L bazel-bin/binaries/gateway_main_/gateway_main "$package_dir/gateway_main"
          cp LICENSE THIRD_PARTY_NOTICES.txt "$package_dir/"
          chmod 0755 "$package_dir/emulator_main" "$package_dir/gateway_main"

          for binary in "$package_dir/emulator_main" "$package_dir/gateway_main"; do
            description="$(file "$binary")"
            echo "$description"
            case "$description" in
              *"Mach-O 64-bit executable arm64"*) ;;
              *)
                echo "Expected a native macOS ARM64 binary: $binary" >&2
                exit 1
                ;;
            esac
            codesign --force --sign - "$binary"
            codesign --verify --verbose=2 "$binary"
            dependencies="$(otool -L "$binary")"
            if [[ "$dependencies" == *"/opt/homebrew/"* ]]; then
              echo "$binary has a non-system Homebrew dependency:" >&2
              echo "$dependencies" >&2
              exit 1
            fi
          done

          "$package_dir/emulator_main" --version >/dev/null
          "$package_dir/gateway_main" --help >/dev/null

          tar -C dist -czf spanner-emulator-macos-arm64.tar.gz \
            spanner-emulator-macos-arm64
          shasum -a 256 spanner-emulator-macos-arm64.tar.gz \
            > spanner-emulator-macos-arm64.tar.gz.sha256

      - name: Upload native macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spanner-emulator-macos-arm64-${{ github.sha }}
          path: |
            spanner-emulator-macos-arm64.tar.gz
            spanner-emulator-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  merge:
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=tag

      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          shopt -s nullglob
          sources=()
          for digest in *; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          if (( ${#sources[@]} != 2 )); then
            echo "Expected two architecture digests, found ${#sources[@]}" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify multi-platform manifest
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          raw_manifest="$(docker buildx imagetools inspect --raw "$IMAGE_TAG")"
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] as $platforms
            | ($platforms | index("linux/amd64")) != null
              and ($platforms | index("linux/arm64")) != null
          ' <<< "$raw_manifest"
