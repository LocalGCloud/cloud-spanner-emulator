      "notes": "SERIALIZABLE (default) and REPEATABLE_READ are honored. REPEATABLE_READ read-write transactions read from a snapshot chosen at their first read, take no shared read locks, still see their own writes, and validate at commit: a key or FOR UPDATE range written by another transaction since the snapshot aborts the commit with ABORTED. Constraint checks still use the latest data. Partitioned DML rejects REPEATABLE_READ. Read-only transactions accept either option."
