    {
      "id": "data.sql.partition_query",
      "category": "Data API and sessions",
      "feature": "PartitionQuery RPC",
      "status": "supported",
      "applicability": "local-development",
      "dialects": [
        "googlesql",
        "postgresql"
      ],
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/partitions.cc",
          "backend/query/partitionability_validator.cc"
        ],
        "tests": [
          "tests/conformance/cases/partition_query.cc",
          "backend/query/partitionability_validator_test.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "PartitionQuery requires a read-only transaction and returns tokens that are only valid with the same session, transaction, SQL, and parameters. Queries that production cannot root-partition (ORDER BY, some subqueries, multi-table scans) are rejected. The response always has exactly two partitions, one empty and one with every row, so it does not model real parallelism or partition_options."
    },
    {
      "id": "data.read.partition_read",
      "category": "Data API and sessions",
      "feature": "PartitionRead RPC",
      "status": "supported",
      "applicability": "local-development",
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/partitions.cc",
          "frontend/converters/partition.cc"
        ],
        "tests": [
          "tests/conformance/cases/partition_reads.cc",
          "frontend/handlers/partitions_test.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "PartitionRead requires a read-only transaction; its tokens must be used with the same session, transaction, table, index, key set, and columns, and a read limit is rejected. The response always has two partitions, one empty and one covering the whole key set."
    },
