    "notes": "JSON-compatible YAML canonical inventory. Classifications are conservative and evidence-linked. Re-audited 2026-09-24 against the jay-spanner-extended fork (persistence, backups, placements, change streams, IAM, sessions, REST gateway). Updated 2026-09-28 after the developer-usability closure and again after the remaining-limitations batches; see docs/plans/2026-09-27-usability-audit-worksheet.md.",
    "fork_revision": "873634fb (jay-spanner-extended at audit time)",
    "targeted_update": "2026-09-28; closed the developer-usability plan (docs/plans/2026-09-27-usability-closure-plan.md): every former partial, unsupported, and unknown record was re-evaluated after implementation, and physical properties were split into not-applicable records. Evidence tiers: native unit and native conformance (fixed-environment Bazel full suite, 159/159 targets), native --data_dir restart probe, and native public-endpoint client matrix and doc-example run on the final binaries; the packaged Docker/LocalCloud image was not qualified. A second targeted update on 2026-09-28 applied three remaining-limitations batches (graph algorithms, search tokenization and scoring, resume tokens, wound-wait lock waits, persisted SPANNER_SYS statistics and new SPANNER_SYS tables, FGAC checks, PostgreSQL search and vector index DDL output, max_commit_delay validation, ListOperations filters, change stream retention cleanup, the persistent-storage range-scan fix, and the --data_dir lock). It re-ran only the native unit and conformance tiers (combined fixed-environment native suite, 164/164 targets on bd6a9646); the client matrix and restart probe were not re-run. A third targeted update on 2026-09-28 qualified the packaged Docker image spanner-emulator-extended:local across all verification tiers (tests/image_verification_test.py and tests/client_matrix/): clients.docker and emulator.packaging became tested: 138 supported, 8 accepted-no-op, 9 not-applicable. Full-inventory review remains dated 2026-09-24. A fourth targeted update on 2026-09-28 synced upstream/master v1.5.58 (a081a7e7), incorporating tables without primary keys, GoogleSQL score_version database option, PostgreSQL TABLESAMPLE (BERNOULLI and SPANNER.RESERVOIR), NULL_FILTERED with WHERE clause index validation, increased table limits (5,000 tables), and internal Queue catalog/validator schema objects.",
    "verification_run": "2026-09-28 on the integration build: fixed-environment Bazel (fixed PATH/CC/CXX/PROTOC, -c opt, shared disk cache) full native suite, final emulator_main/gateway_main public-endpoint client matrix, official doc-example conformance, and a disposable --data_dir restart probe. After the remaining-limitations batches: the combined native suite only (164/164 targets on bd6a9646). The packaged Docker image spanner-emulator-extended:local was qualified on 2026-09-28 across the external client matrix (REST, Go, Node, Python, Java, JDBC, PGAdapter, psql) and the 5-step image test suite (tests/image_verification_test.py). See docs/plans/2026-09-27-usability-audit-worksheet.md.",
    "evidence_tiers": {
      "native unit": "Focused Bazel unit targets in this repository.",
      "native conformance": "tests/conformance suites through the C++ client over gRPC, both dialects.",
      "native restart": "A disposable --data_dir stop/restart probe against a built emulator_main.",
      "native public endpoint": "External SDKs and drivers (tests/client_matrix) and the doc-example harness against built binaries.",
      "packaged image": "Qualified on 2026-09-28 against spanner-emulator-extended:local (tests/image_verification_test.py and tests/client_matrix/): client matrix (Go, Node, Python, Java, JDBC, PGAdapter, psql, REST with error envelopes), persistent volume restart (both dialects, roles, definer views, database options, TTL policy, sequences, unique indexes, version_time backups, split points, query stats), data directory locking, flag forwarding, and feature spot checks (REPEATABLE_READ, wound-wait locks, PLAN/PROFILE, PageRank, Unicode search, PostgreSQL ScaNN)."
    }
