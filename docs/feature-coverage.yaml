    {
      "id": "data.sql.execute",
      "category": "Data API and sessions",
      "feature": "ExecuteSql RPC",
      "status": "supported",
      "applicability": "local-development",
      "dialects": [
        "googlesql",
        "postgresql"
      ],
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/queries.cc",
          "backend/query/query_engine.cc"
        ],
        "tests": [
          "frontend/handlers/queries_test.cc",
          "tests/conformance/cases/query.cc",
          "tests/conformance/cases/dml.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "ExecuteSql runs GoogleSQL and PostgreSQL queries and DML with typed or untyped parameters, THEN RETURN / RETURNING, and PLAN/PROFILE modes (no real query plans). Read timestamps more than 1 hour in the future are rejected, and reads older than the version retention period (default 1 hour) fail with FAILED_PRECONDITION."
    },
    {
      "id": "data.sql.execute_streaming",
      "category": "Data API and sessions",
      "feature": "ExecuteStreamingSql RPC",
      "status": "supported",
      "applicability": "local-development",
      "dialects": [
        "googlesql",
        "postgresql"
      ],
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/queries.cc",
          "frontend/converters/chunking.cc"
        ],
        "tests": [
          "frontend/handlers/queries_test.cc",
          "frontend/converters/chunking_test.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "Results stream as PartialResultSets split into chunks of at most 1 MB, with chunked_value set when a value spans chunks. Resume tokens are not supported, so a client must retry an interrupted stream from the start."
    },
    {
