          "frontend/handlers/transactions_test.cc",
          "tests/conformance/cases/transactions.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "Reads, queries, and DML accept single_use, id, and begin (inline begin) transaction selectors; inline begin returns the new transaction in result metadata. Partitioned DML transactions cannot be used for reads, and invalid or finished transaction IDs are rejected."
    },
