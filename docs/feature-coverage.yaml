  "features": [
    {
      "id": "data.sessions.create",
      "category": "Data API and sessions",
      "feature": "CreateSession RPC",
      "status": "supported",
      "applicability": "local-development",
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/sessions.cc",
          "frontend/collections/session_manager.cc"
        ],
        "tests": [
          "tests/conformance/cases/sessions.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "CreateSession works in both dialects and stores labels; a missing instance or database returns NOT_FOUND. Regular sessions expire after 1 hour idle. Sessions are memory-only and are lost on restart even with --data_dir, so clients must recreate them."
    },
    {
      "id": "data.sessions.get",
      "category": "Data API and sessions",
      "feature": "GetSession RPC",
      "status": "supported",
      "applicability": "local-development",
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/sessions.cc",
          "frontend/collections/session_manager.cc"
        ],
        "tests": [
          "tests/conformance/cases/sessions.cc",
          "frontend/collections/session_manager_test.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "GetSession returns labels, approximate_last_use_time, and the multiplexed flag. A malformed name returns INVALID_ARGUMENT; a deleted or expired session returns NOT_FOUND."
    },
    {
