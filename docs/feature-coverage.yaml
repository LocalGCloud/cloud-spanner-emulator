    {
      "id": "transactions.concurrency_model",
      "category": "Transactions, timestamps, and concurrency",
      "feature": "Concurrency, aborts, and fault injection",
      "status": "supported",
      "applicability": "local-development",
      "dialects": [
        "api"
      ],
      "docs": [
        "https://cloud.google.com/spanner/docs/transactions"
      ],
      "evidence": {
        "implementation": [
          "backend/locking/manager.cc",
          "backend/transaction/read_write_transaction.cc",
          "common/config.cc",
          "backend/locking/handle.cc"
        ],
        "tests": [
          "backend/locking/manager_test.cc",
          "backend/database/database_test.cc",
          "tests/conformance/cases/batch_dml.cc",
          "backend/transaction/read_write_transaction_test.cc",
          "gateway/gateway_test.go"
        ],
        "documentation": [
          "README.md"
        ]
      },
      "verification": "tested",
      "notes": "Key/range shared and exclusive locks let disjoint read-write transactions commit concurrently. Conflicts follow wound-wait: a younger transaction waits up to --lock_wait_timeout_ms (default 10000, forwarded by gateway_main; 0 restores abort-at-once) for a lock an older transaction holds and then aborts with ABORTED, and an older requester aborts (wounds) a younger holder. In a two-key deadlock exactly one transaction aborts, and an aborted requester releases its locks at once. Focused manager and transaction tests cover waits, wounds, timeouts, disjoint ranges and tables, read upgrade, lock cleanup, abort/retry, deadlock, and a 5,000-row insert performance gate. --abort_current_transaction_probability (default 20, emulator_main only) lets a younger requester sometimes abort an idle older holder instead of waiting; schema changes never wait. SPANNER_SYS.LOCK_STATS reports the measured waits. --enable_fault_injection aborts about 5% of first commit attempts. Differences: waits ignore the RPC deadline, idle transactions are not aborted after 10 seconds, and READ_STATS AVG_LOCKING_DELAY_SECONDS stays 0."
    },
