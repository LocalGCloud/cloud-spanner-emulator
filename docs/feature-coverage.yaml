  "features": [
    {
      "id": "data.sessions.create",
      "category": "Data API and sessions",
      "feature": "CreateSession RPC",
      "status": "supported",
      "applicability": "local-development",
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/sessions.cc",
          "frontend/collections/session_manager.cc"
        ],
        "tests": [
          "tests/conformance/cases/sessions.cc",
          "frontend/handlers/sessions_test.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "CreateSession works in both dialects and stores labels; a missing instance or database returns NOT_FOUND. creator_role is validated (an unknown role returns PERMISSION_DENIED) and echoed. Regular sessions expire after 1 hour idle. Sessions are memory-only and are lost on restart even with --data_dir, so clients must recreate them."
    },
    {
