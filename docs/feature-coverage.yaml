    {
      "id": "data.sql.execute",
      "category": "Data API and sessions",
      "feature": "ExecuteSql RPC",
      "status": "supported",
      "applicability": "local-development",
      "dialects": [
        "googlesql",
        "postgresql"
      ],
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/queries.cc",
          "backend/query/query_engine.cc"
        ],
        "tests": [
          "frontend/handlers/queries_test.cc",
          "tests/conformance/cases/query.cc",
          "tests/conformance/cases/dml.cc",
          "tests/conformance/cases/query_modes.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "ExecuteSql runs GoogleSQL and PostgreSQL queries and DML with typed or untyped parameters, THEN RETURN / RETURNING, and PLAN/PROFILE modes with plan trees and query statistics (see googlesql.query_modes). Read timestamps more than 1 hour in the future are rejected, and reads older than the version retention period (default 1 hour) fail with FAILED_PRECONDITION."
    },
    {
      "id": "data.sql.execute_streaming",
      "category": "Data API and sessions",
      "feature": "ExecuteStreamingSql RPC",
      "status": "supported",
      "applicability": "local-development",
      "dialects": [
        "googlesql",
        "postgresql"
      ],
      "docs": [
        "https://cloud.google.com/spanner/docs/reference/rpc/google.spanner.v1#spanner"
      ],
      "evidence": {
        "implementation": [
          "frontend/handlers/queries.cc",
          "frontend/converters/chunking.cc",
          "frontend/converters/resume_tokens.cc",
          "frontend/proto/resume_token.proto"
        ],
        "tests": [
          "frontend/handlers/queries_test.cc",
          "frontend/converters/chunking_test.cc",
          "tests/conformance/cases/query_modes.cc",
          "frontend/converters/resume_tokens_test.cc"
        ],
        "documentation": []
      },
      "verification": "tested",
      "notes": "Results stream as PartialResultSets of whole rows, each response at most 1 MB; a row larger than that is split across responses with chunked_value. The query plan comes with the stream and statistics on its last message. Responses that end on a row boundary carry a resume token (request fingerprint, transaction or single-use read timestamp, row count and a fingerprint of the rows sent); a request resent with the token re-executes in the same transaction or at the same read timestamp and continues after that row. A garbled token, a token from a different request, or a resent request that begins a new transaction returns INVALID_ARGUMENT, and rows that differ on re-execution (a nondeterministic result such as RAND()) return FAILED_PRECONDITION. DML streams carry no resume tokens."
    },
    {
