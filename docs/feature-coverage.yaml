      "notes": "If one database in --data_dir fails to restore at startup, the rest of the emulator still starts. The failed database is listed as CREATING and its reads, writes, and DDL return FAILED_PRECONDITION with the reason. --repair_corrupted_databases (accepted by gateway_main and emulator_main) moves its whole folder to <data_dir>/.quarantine and removes it from metadata, so later starts succeed without it. DropDatabase on it also moves it to .quarantine and frees its name; until then, CreateDatabase with that name returns ALREADY_EXISTS."
    },
