syntax = "proto2";

package google.spanner.emulator.frontend;

// Resume token of a PartialResultSet of ExecuteStreamingSql or StreamingRead.
// Resending the stream's request with the token resumes the stream after the
// position that the token records.
message ResumeToken {
  // Fingerprint of the request fields that determine the stream's results.
  optional fixed64 request_fingerprint = 1;

  // A position in the rows of a query or read.
  message RowPosition {
    // The transaction that the stream reads in, or 0 for a single-use
    // transaction.
    optional int64 transaction_id = 1;

    // The read timestamp of a single-use transaction, in microseconds since
    // the Unix epoch. A resumed stream reads at the same timestamp.
    optional int64 read_timestamp_micros = 2;

    // The number of rows before the position, and a fingerprint of them that
    // detects if a resumed stream would not repeat them.
    optional int64 row_count = 3;
    optional fixed64 rows_fingerprint = 4;
  }

  // A position in the change records of a change stream query: after every
  // record with a timestamp before `timestamp_micros`, and after the first
  // `record_index` records at that timestamp.
  message ChangeStreamPosition {
    // The partition that the query reads, empty for the initial query.
    optional string partition_token = 1;

    // Microseconds since the Unix epoch.
    optional int64 timestamp_micros = 2;

    optional int64 record_index = 3;
  }

  oneof position {
    RowPosition rows = 2;
    ChangeStreamPosition change_stream = 3;
  }
}
